<div class="login-shell">
    <div class="snow-orb orb-left"></div>
    <div class="snow-orb orb-right"></div>
    <div class="login-card shadow-5">
        <div class="brand-block">
            <img src="assets/imgs/VAAO_LOGO.png" alt="VAAO logo">
            <h1>Bienvenido a VAAO</h1>
            <p>Gestiona pedidos, entregas y ventas desde una sola plataforma.</p>
        </div>
        <div class="p-fluid p-formgrid grid mt-2">
            <div class="field col-12 mb-2">
                <label>Usuario</label>
                <input 
                    type="text"
                    pInputText
                    placeholder="Ingrese su nombre de usuario"
                    [(ngModel)]="username">
            </div>
            <div class="field col-12 mb-2">
                <label>Contrasena</label>
                <input 
                    type="password"
                    pInputText
                    placeholder="Ingrese su contrasena"
                    [(ngModel)]="password">
            </div>
            <div class="field col-12 mb-0">
                <p-button
                    styleClass="w-full"
                    (onClick)="login()"
                    label="Ingresar"
                    icon="pi pi-sign-in"
                    severity="success"/>
            </div>
        </div>
    </div>
</div>
