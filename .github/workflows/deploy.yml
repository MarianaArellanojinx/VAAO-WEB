name: Deploy VAAO Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      - run: |
          cd vaao
          npm install
          npm run build
          rm -rf /var/www/app
          cp -r dist/vaao/browser /var/www/app
          sudo systemctl reload nginx

